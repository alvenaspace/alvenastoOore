<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alvena's store ♡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#f5f3ef] text-gray-700 min-h-screen pb-12">

  <div class="max-w-3xl mx-auto px-4 pt-6 space-y-6">

    <!-- NETFLIX SECTION -->
    <div class="bg-white/50 rounded-3xl p-5 border border-pink-100/60 shadow-sm">
      
      <!-- Netflix Category Header -->
      <div class="flex items-center gap-3 mb-4">
        
        <!-- LOGO UTAMA (Bisa diklik untuk pilih gambar dari Galeri) -->
        <div class="relative w-11 h-11 rounded-2xl overflow-hidden shadow-sm flex-shrink-0 bg-pink-500 cursor-pointer group" onclick="document.getElementById('mainLogoInput').click()">
          <img id="mainLogoImg" src="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico" alt="Logo" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-[10px] font-bold">
            Ubah
          </div>
        </div>
        <!-- Input file tersembunyi untuk Galeri -->
        <input type="file" id="mainLogoInput" accept="image/*" class="hidden" onchange="previewImage(this, 'mainLogoImg')">

        <div>
          <h4 class="font-bold text-sm text-gray-800">Netflix</h4>
          <p class="text-[11px] text-gray-400">streaming package • ready to order</p>
        </div>
      </div>

      <!-- Cards Grid -->
      <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-none">

        <!-- CARD 1 -->
        <div class="bg-[#fce7f3]/60 hover:bg-[#fce7f3] transition p-3.5 rounded-2xl border border-pink-100 min-w-[150px] flex-shrink-0 flex flex-col justify-between">
          <div>
            <div class="flex items-center gap-1.5 mb-1">
              <!-- LOGO CARD 1 (Klik untuk ganti dari Galeri) -->
              <div class="w-4 h-4 rounded overflow-hidden cursor-pointer flex-shrink-0" onclick="document.getElementById('cardInput1').click()">
                <img id="cardImg1" src="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico" class="w-full h-full object-cover">
              </div>
              <input type="file" id="cardInput1" accept="image/*" class="hidden" onchange="previewImage(this, 'cardImg1')">

              <span class="font-bold text-xs text-gray-800">Netflix 1U — 3 hari</span>
            </div>
            <div class="text-xs font-semibold text-pink-600 mt-1">Rp 12.000</div>
          </div>
          <button class="mt-3 bg-[#e91e63] hover:bg-[#d81b60] text-white text-[11px] font-medium py-1.5 px-3 rounded-xl transition w-full shadow-sm">
            + Keranjang
          </button>
        </div>

        <!-- CARD 2 -->
        <div class="bg-[#fce7f3]/60 hover:bg-[#fce7f3] transition p-3.5 rounded-2xl border border-pink-100 min-w-[150px] flex-shrink-0 flex flex-col justify-between">
          <div>
            <div class="flex items-center gap-1.5 mb-1">
              <!-- LOGO CARD 2 -->
              <div class="w-4 h-4 rounded overflow-hidden cursor-pointer flex-shrink-0" onclick="document.getElementById('cardInput2').click()">
                <img id="cardImg2" src="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico" class="w-full h-full object-cover">
              </div>
              <input type="file" id="cardInput2" accept="image/*" class="hidden" onchange="previewImage(this, 'cardImg2')">

              <span class="font-bold text-xs text-gray-800">Netflix 1U — 7 hari</span>
            </div>
            <div class="text-xs font-semibold text-pink-600 mt-1">Rp 18.000</div>
          </div>
          <button class="mt-3 bg-[#e91e63] hover:bg-[#d81b60] text-white text-[11px] font-medium py-1.5 px-3 rounded-xl transition w-full shadow-sm">
            + Keranjang
          </button>
        </div>

      </div>
    </div>

  </div>

  <!-- Script JavaScript untuk Membaca File dari Galeri -->
  <script>
    function previewImage(input, targetImgId) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById(targetImgId).src = e.target.result;
        }
        reader.readAsDataURL(input.files[0]);
      }
    }
  </script>
</body>
</html>
